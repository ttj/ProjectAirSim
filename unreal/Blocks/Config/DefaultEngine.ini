; ---- PATH B: SM6 + hardware ray tracing (2026-09-07) --------------------------------------
; THREE settings, not two. The first attempt set only the first two and the editor SEGFAULTED
; four seconds after Vulkan init; the log named the cause itself:
;   "Ray tracing requires skin cache to be enabled. Set r.SkinCache.CompileShaders=1."
; So SM6 is not broken on this build -- RT without the skin cache is. Gates:
;   1. VULKAN_SM5 declares bSupportsRayTracing=false AND bSupportsNanite=false, so SM6 is
;      required for BOTH (Blocks.log:736).
;   2. r.RayTracing=0 is the compiled default at DeferredShadingRenderer.cpp:214 and is
;      ECVF_READONLY -- settable only from ini before startup, not from console (Blocks.log:1179).
;   3. r.SkinCache.CompileShaders=1, or the RT init crashes.
; Revert: DefaultEngine.ini.bak-presm6-20260907. Expect a long shader recompile.
[/Script/LinuxTargetPlatform.LinuxTargetSettings]
+TargetedRHIs=SF_VULKAN_SM6
